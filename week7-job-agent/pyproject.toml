[project]
name = "jobagent"
version = "0.2.0"
description = "Course job agent: source adapters and a deterministic engine around one model step"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
]

[project.scripts]
jobagent = "jobagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobagent"]
